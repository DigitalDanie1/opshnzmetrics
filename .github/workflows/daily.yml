# 매일 아침 GitHub 서버에서 데이터를 새로 받아 사이트(index.html)를 다시 만들고 저장소에 올린다.
# Mac 이 꺼져 있어도 돈다. 실패하면(예: CoinGecko 일시 차단) 2시간 반 뒤 한 번 더 시도한다.
name: Daily build

on:
  schedule:
    - cron: '5 1 * * *'    # 10:05 KST
    - cron: '35 3 * * *'   # 12:35 KST 재시도 — 오늘 이미 성공했으면 건너뜀
  workflow_dispatch: {}    # Actions 탭에서 "Run workflow" 로 바로 실행

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip the retry if today is already built
        id: done
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event.schedule }}" = "35 3 * * *" ] && git log -1 --format=%s | grep -q "daily build $today"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (data → index.html, Telegram on Mondays if secrets are set)
        if: steps.done.outputs.skip != '1'
        env:
          CI: '1'
          CHROME: /usr/bin/google-chrome
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: node publish.mjs --auto

      - name: Commit and push the new build
        if: steps.done.outputs.skip != '1'
        run: |
          git config user.name "opshnz-bot"
          git config user.email "opshnz-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "daily build $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash
          git push
